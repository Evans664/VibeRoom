<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="VibeRoom, a music space by The Dev Room. Discover, stream and enjoy your favorite music in one place.">
  <meta name="theme-color" content="#050807">
  <title>VibeRoom | Welcome</title>
  <link rel="icon" href="assets/icons/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">

  <main class="welcome-shell">

        <img src="assets/icons/logo-mark.svg" alt="">
        <span class="brand-word">Vibe<span>Room</span></span>

      <div class="welcome-actions">
        <a class="button button-primary button-lg" href="pages/home.html">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

        <a class="button button-outline" href="pages/home.html">Continue as Guest</a>
      </div>

      <p class="built-by">Built by The Dev Room</p>
    </section>
