<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050807">
  <title>VibeRoom | Sign in</title>
  <link rel="icon" href="../assets/icons/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <main class="welcome-shell">
    <section class="welcome-panel auth-panel" aria-labelledby="auth-title">
      <a class="brand" href="../index.html" aria-label="VibeRoom welcome page">
        <img src="../assets/icons/logo-mark.svg" alt="">
        <span class="brand-word">Vibe<span>Room</span></span>
      </a>

      <h1 id="auth-title" class="auth-title" data-auth-title>Create your account</h1>
      <p class="welcome-copy" data-auth-lead>Save the songs you love and build playlists that follow you everywhere.</p>

      <form class="auth-form" data-auth-form novalidate>
        <div class="field" data-signup-only>
          <label for="auth-name">Name</label>
          <input id="auth-name" name="displayName" type="text" autocomplete="name" maxlength="50" required>
        </div>
        <div class="field">
          <label for="auth-email">Email</label>
          <input id="auth-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="6" required>
          <p class="field-hint" data-signup-only>At least 6 characters.</p>
        </div>

        <p class="form-error" data-auth-error role="alert"></p>

        <button class="button button-primary button-lg" type="submit" data-auth-submit>Create account</button>
      </form>

      <p class="auth-switch">
        <span data-auth-switch-text>Already have an account?</span>
        <a href="auth.html?mode=signin" data-auth-switch>Sign in</a>
      </p>
      <a class="button button-outline" href="home.html">Continue as Guest</a>
    </section>
  </main>
  <script type="module" src="../js/auth-page.js"></script>
</body>
</html>
