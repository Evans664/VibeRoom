<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibeRoom | Home</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <main class="page-shell"><p class="eyebrow">VIBEROOM / GUEST MODE</p><h1>Make room for a new sound.</h1><p class="welcome-copy">The product shell is ready for the team. This preview is powered by local mock data.</p><section aria-labelledby="tracks-title"><h2 id="tracks-title">Starter tracks</h2><div data-song-list></div></section><p><a class="button button-secondary" href="../index.html">Back to welcome</a></p></main>
 
 
 <footer
  class="player-bar"
  data-player
  aria-label="Music player"
>

  <div class="player-track">
    <strong data-player-title>
      No track selected
    </strong>

    <span data-player-artist></span>
  </div>

  <div class="player-controls">

    <button
      type="button"
      data-player-previous
    >
      Previous
    </button>

    <button
      type="button"
      data-player-toggle
    >
      Play
    </button>

    <button
      type="button"
      data-player-next
    >
      Next
    </button>

    <button
      type="button"
      data-player-shuffle
      aria-pressed="false"
    >
      Shuffle
    </button>

    <button
      type="button"
      data-player-repeat
      aria-pressed="false"
    >
      Repeat
    </button>

  </div>

  <div class="player-progress">

    <span data-player-current-time>
      0:00
    </span>

    <input
      type="range"
      min="0"
      max="0"
      value="0"
      step="0.1"
      data-player-progress
      aria-label="Song progress"
    >

    <span data-player-duration>
      0:00
    </span>

  </div>

  <label>
    Volume

    <input
      type="range"
      min="0"
      max="1"
      value="1"
      step="0.01"
      data-player-volume
    >
  </label>

  <p
    data-player-status
    aria-live="polite"
  >
    Nothing playing
  </p>

</footer>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
