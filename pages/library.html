<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050807">
  <title>VibeRoom | Library</title>
  <link rel="icon" href="../assets/icons/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="../index.html" aria-label="VibeRoom welcome page">
        <img src="../assets/icons/logo-mark.svg" alt="">
        <span class="brand-word">Vibe<span>Room</span></span>
      </a>
      <span class="mode-chip">Guest mode</span>
    </header>

    <nav class="app-nav" aria-label="Primary">
      <a class="nav-link" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a class="nav-link" href="search.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search</span>
      </a>
      <a class="nav-link" href="library.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 4v16M10 4v16M15 5l4.5 15"/></svg>
        <span>Library</span>
      </a>
    </nav>

    <main id="main" class="app-main" data-library>
      <section class="page-section" aria-labelledby="library-title">
        <p class="eyebrow" data-library-eyebrow>Your music</p>
        <h1 id="library-title" class="page-title">Your Library</h1>
        <p class="page-lead">Your playlists and liked songs, all in one place.</p>
      </section>

      <section class="page-section" aria-labelledby="playlists-title">
        <div class="section-heading">
          <h2 id="playlists-title" class="section-title">Playlists</h2>
          <button type="button" class="button button-outline button-sm" data-create-playlist>New playlist</button>
        </div>
        <div class="playlist-grid" data-playlist-grid>
          <div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>
        </div>
      </section>

      <section class="page-section" aria-labelledby="liked-title">
        <div class="section-heading">
          <h2 id="liked-title" class="section-title">Liked Songs</h2>
          <span class="section-meta" data-liked-count></span>
        </div>
        <div data-liked-list>
          <div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>
        </div>
      </section>
    </main>
    <footer class="player-bar" data-player aria-label="Music player"></footer>
  </div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
